services:
  - type: web
    name: conecta-jovem
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /saude
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: conecta-jovem-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.3

databases:
  - name: conecta-jovem-db
    plan: free