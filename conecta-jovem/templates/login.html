{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="wrap"><div class="painel estreito">
  <h2>Entrar</h2>
  <form class="form" method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
    <div><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email"></div>
    <div><label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-pri" type="submit">Entrar</button>
  </form>
  <p class="mut" style="margin-top:16px">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a>.</p>
</div></div>
{% endblock %}
