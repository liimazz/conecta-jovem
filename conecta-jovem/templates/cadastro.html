{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="wrap"><div class="painel estreito">
  <h2>Criar conta</h2>
  <form class="form" method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div><label for="nome">Nome</label><input id="nome" name="nome" value="{{ nome }}" required minlength="2" maxlength="100" autocomplete="name"></div>
    <div><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ email }}" required maxlength="120" autocomplete="email"></div>
    <div><label for="senha">Senha</label><input id="senha" name="senha" type="password" required minlength="8" autocomplete="new-password"><small class="mut">Mínimo de 8 caracteres, com letras e números.</small></div>
    <div><label for="confirmar_senha">Confirmar senha</label><input id="confirmar_senha" name="confirmar_senha" type="password" required autocomplete="new-password"></div>
    <button class="btn btn-pri" type="submit">Criar conta</button>
  </form>
  <p class="mut" style="margin-top:16px">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>.</p>
</div></div>
{% endblock %}
